[workspace]
members = ["examples", "rotors-macros", "rotors"]
resolver = "2"

[workspace.package]
version = "0.3.0"
authors = ["Mattia Penati", "Francesco Cattoglio"]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/hypermynds/rotors"
repository = "https://github.com/hypermynds/rotors"

[workspace.dependencies]
rotors-macros = { path = "./rotors-macros", version = "0.3.0" }
tonic = { version = "0.14", default-features = false }
tonic-build = { version = "0.14", default-features = false }
